<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WedOS — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090C;
    --surface: #0F1117;
    --border: rgba(255,255,255,0.07);
    --gold: #C9A84C;
    --gold-dim: rgba(201,168,76,0.15);
    --rose: #C8706A;
    --text: #EDEAE4;
    --text-dim: #7A7870;
    --text-dimmer: #3A3835;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; }

  .left-panel {
    width: 45%;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }
  .left-panel::before {
    content: '';
    position: absolute;
    top: -150px; left: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(ellipse, rgba(201,168,76,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .left-panel::after {
    content: '';
    position: absolute;
    bottom: -100px; right: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(ellipse, rgba(200,112,106,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .brand { text-align: center; margin-bottom: 56px; }
  .brand-logo { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; color: var(--gold); letter-spacing: 0.04em; }
  .brand-tagline { font-size: 13px; color: var(--text-dim); margin-top: 6px; font-weight: 300; }

  .quote-block { border-left: 2px solid rgba(201,168,76,0.3); padding-left: 20px; max-width: 320px; }
  .quote-text { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-style: italic; font-weight: 300; color: var(--text); line-height: 1.5; margin-bottom: 14px; }
  .quote-source { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); }

  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px;
  }

  .form-box { width: 100%; max-width: 380px; }
  .form-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 400; color: var(--text); margin-bottom: 6px; }
  .form-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 36px; font-weight: 300; }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
  .field input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 13px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .field input::placeholder { color: var(--text-dimmer); }
  .field input:focus { border-color: rgba(201,168,76,0.4); }

  .forgot { text-align: right; margin-top: -10px; margin-bottom: 24px; }
  .forgot a { font-size: 12px; color: var(--text-dim); text-decoration: none; }
  .forgot a:hover { color: var(--gold); }

  .btn-primary {
    width: 100%;
    background: var(--gold);
    color: #0F0C05;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-bottom: 16px;
  }
  .btn-primary:hover { opacity: 0.9; }

  .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-size: 11px; color: var(--text-dimmer); }

  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-bottom: 28px;
  }
  .btn-secondary:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

  .signup-prompt { text-align: center; font-size: 13px; color: var(--text-dim); }
  .signup-prompt a { color: var(--gold); text-decoration: none; }

  .error-msg { background: rgba(200,112,106,0.1); border: 1px solid rgba(200,112,106,0.3); border-radius: 7px; padding: 10px 14px; font-size: 12px; color: var(--rose); margin-bottom: 16px; display: none; }
</style>
</head>
<body>

<div class="left-panel">
  <div class="brand">
    <div class="brand-logo">WedOS</div>
    <div class="brand-tagline">The Wedding Operating System</div>
  </div>
  <div class="quote-block">
    <div class="quote-text">"Every vendor. Every detail. Every moment — coordinated in real time."</div>
    <div class="quote-source">WedOS Platform</div>
  </div>
</div>

<div class="right-panel">
  <div class="form-box">
    <div class="form-title">Welcome back</div>
    <div class="form-sub">Sign in to your WedOS account</div>

    <div class="error-msg" id="errorMsg">Incorrect email or password. Please try again.</div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    <div class="forgot"><a href="#">Forgot password?</a></div>

    <button class="btn-primary" onclick="handleLogin()">Sign In →</button>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or</div>
      <div class="divider-line"></div>
    </div>

    <button class="btn-secondary" onclick="window.location.href='signup.html'">Create a new account</button>

    <div class="signup-prompt">
      New to WedOS? <a href="signup.html">Join the waitlist</a>
    </div>
  </div>
</div>

<script>
  function handleLogin() {
    const email = document.getElementById('emailInput').value;
    const password = document.getElementById('passwordInput').value;
    const errorMsg = document.getElementById('errorMsg');

    if (!email || !password) {
      errorMsg.textContent = 'Please enter your email and password.';
      errorMsg.style.display = 'block';
      return;
    }

    // Demo routing: couple vs vendor
    if (email.includes('vendor')) {
      window.location.href = 'wedos-vendor-portal.html';
    } else {
      window.location.href = 'wedos-couple-dashboard.html';
    }
  }

  // Allow pressing Enter to submit
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
